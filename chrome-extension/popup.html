<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F9FAFB;
      color: #111827;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background-color: #2563EB;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
    }
    .field-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: #6B7280;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 13px;
      background-color: white;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #2563EB;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background-color: #1D4ED8;
    }
    button:disabled {
      background-color: #9CA3AF;
      cursor: not-allowed;
    }
    #state-loading, #state-success {
      display: none;
      text-align: center;
      font-size: 13px;
      padding: 20px 0;
    }
    .success-text {
      color: #059669;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">CB</div>
    <div class="title">CareerBoard</div>
  </div>

  <div id="state-loading">
    Loading job details...
  </div>

  <div id="state-ready">
    <div class="field-group">
      <label>Job Title</label>
      <input type="text" id="field-role" placeholder="e.g. Frontend Engineer" />
    </div>

    <div class="field-group">
      <label>Company</label>
      <input type="text" id="field-company" placeholder="e.g. Google" />
    </div>

    <div class="field-group">
      <label>Status</label>
      <select id="status">
        <option value="wishlist">Wishlist</option>
        <option value="applied" selected>Applied</option>
        <option value="interviewing">Interviewing</option>
      </select>
    </div>

    <button id="btn-save">Save to CareerBoard</button>
  </div>

  <div id="state-success">
    <div class="success-text">✓ Job Saved Successfully!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
